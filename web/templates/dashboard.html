<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionAttend AI | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --secondary: #ec4899; --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); }
        body { font-family: 'Outfit', sans-serif; background: #0b0f1a; color: white; min-height: 100vh; overflow-x: hidden; }
        .sidebar { width: 280px; background: var(--glass); backdrop-filter: blur(20px); border-right: 1px solid var(--glass-border); height: 100vh; position: fixed; padding: 2rem; }
        .main-content { margin-left: 280px; padding: 2rem 3rem; }
        .glass-card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 1.5rem; transition: 0.3s; }
        .nav-link { color: #94a3b8; padding: 1rem; border-radius: 12px; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .nav-link.active { background: var(--glass); color: white; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo mb-5 fw-800 fs-4 text-primary">VisionAttend AI</div>
        <nav class="nav flex-column">
            <a href="/" class="nav-link active"><i class="bi bi-grid-fill"></i> Dashboard</a>
            <a href="/register" class="nav-link"><i class="bi bi-person-plus-fill"></i> Register Student</a>
            <a href="/analytics" class="nav-link"><i class="bi bi-bar-chart-line-fill"></i> Analytics</a>
            <a href="/settings" class="nav-link"><i class="bi bi-gear-fill"></i> Settings</a>
        </nav>
    </aside>
    <main class="main-content">
        <h1 class="fw-800 mb-5">System Dashboard</h1>
        <div class="row g-4">
            <div class="col-md-3"><div class="glass-card"><h6>Total Students</h6><h2 id="totalStudents">0</h2></div></div>
            <div class="col-md-3"><div class="glass-card"><h6>Present Today</h6><h2 id="presentToday">0</h2></div></div>
            <div class="col-md-6">
                <div class="glass-card">
                    <h5>Recent Attendance</h5>
                    <table class="table table-dark table-borderless mt-3">
                        <tbody id="attendanceLogs"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script>
        async function loadData() {
            const res = await fetch('/api/stats');
            const data = await res.json();
            document.getElementById('totalStudents').innerText = data.total_students;
            document.getElementById('presentToday').innerText = data.present_today;
        }
        window.onload = loadData;
    </script>
</body>
</html>
